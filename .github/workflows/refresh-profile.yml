name: Refresh profile

# Keeps the GitHub profile README fresh: syncs the activity feed, then
# commits if anything changed.
#
# Setup:
#   1. Create a personal access token with the `repo` scope and store it as
#      the PROFILE_PAT secret (GITHUB_TOKEN cannot push to a *different*
#      repository, and your profile lives in <user>/<user>).
#      Alternative: copy this workflow into your <user>/<user> repo and drop
#      the second checkout + PROFILE_PAT, using GITHUB_TOKEN instead.
#   2. Make sure your profile README contains the activity marker section:
#      <!--START_SECTION:activity--> ... <!--END_SECTION:activity-->
#      (Generate a starter with `profileforge render-readme`.)
#
# Note: sync-stats is intentionally NOT run here. The profile README's stats
# section is hand-maintained (own-design markup the generator would replace),
# so only the activity feed is automated.

on:
  schedule:
    # Daily at 04:17 UTC — quiet hours for the API and for your profile.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profileforge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install profileforge
        run: pip install .

      - name: Check out profile repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
          path: profile
          token: ${{ secrets.PROFILE_PAT }}

      # Stats are hand-maintained in the profile README; do not add a
      # sync-stats step here (it would replace the stats section wholesale).
      - name: Sync activity
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: profileforge sync-activity --target profile/README.md

      - name: Commit and push if changed
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile data [skip ci]"
          git push
