name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Weekly run catches dependency drift between pushes: Dependabot can
  # propose a breaking update on Monday and nothing would test it until
  # the next push otherwise.
  schedule:
    - cron: "0 9 * * 1"

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      # The supported floor is >=3.11; test it, don't just declare it.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src

      - name: Tests with coverage gate
        run: pytest --cov=profileforge --cov-report=term-missing --cov-fail-under=90
