# Install once (with the dev venv activated):
#   pip install pre-commit && pre-commit install
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs from the local environment (dev venv must be activated) so it
  # always uses the project's mypy with all dependencies importable — no
  # version drift between the hook env and the project.
  - repo: local
    hooks:
      - id: mypy-local
        name: mypy (strict)
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
