[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profileforge"
dynamic = ["version"]
description = "Tooling that powers a living GitHub profile: activity sync, doc export, and portfolio site generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Justin" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.8",
]

[project.scripts]
profileforge = "profileforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/profileforge"]

# Single source of truth for the version: src/profileforge/__init__.py.
# (Previously the version also lived in [project], and the two drifted.)
[tool.hatch.version]
path = "src/profileforge/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "DTZ", "T201"]

[tool.ruff.lint.per-file-ignores]
# tests/_legacy.py is a verbatim golden-master copy of the legacy script;
# the linter must not modernize it.
"tests/_legacy.py" = ["UP017", "E501", "T201"]
# typer.Option/typer.Argument in defaults is typer's documented pattern;
# B008 is a false positive here.
"src/profileforge/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["profileforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
